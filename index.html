<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fabi Barili · Game Design Portfolio</title>
  <meta name="description" content="Portfolio de Fabi Barili, Game Designer com foco em jogos mobile." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" data-name></a>
      <div class="header-right">
        <nav class="nav">
          <a href="#sobre" data-i18n="navAbout">About</a>
          <a href="#experiencia" data-i18n="navExperience">Experience</a>
          <a href="#projetos" data-i18n="navGames">Projects</a>
          <a href="#contato" data-i18n="navContact">Contact</a>
        </nav>
        <div class="lang-switch" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="pt" aria-pressed="false">PT</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="sobre">
      <div class="container">
        <div class="photo reveal">
          <img id="photo" alt="Foto" />
        </div>
        <div class="reveal">
          <span class="eyebrow" data-role></span>
          <h1><span data-i18n="hello">Hi, I'm</span> <span data-short-name></span>.</h1>
          <div id="bio"></div>
          <div class="hero-links">
            <a href="#projetos" class="btn primary" data-i18n="seeGames">Projects ↓</a>
            <span id="hero-links" style="display:contents"></span>
            <!-- CV desativado por enquanto:
            <a id="cv" class="btn" download="Fabi-Barili-CV.pdf" data-i18n="downloadCv">Download CV ↓</a>
            -->
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="experiencia">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="experience">Experience</h2>
        </div>
        <ol class="exp-accordion" id="experience"></ol>
      </div>
    </section>

    <section class="section" id="projetos">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="games">Projects</h2>
          <span id="games-count"></span>
        </div>
        <div class="games" id="games"></div>
      </div>
    </section>

    <section class="section contact" id="contato">
      <div class="container">
        <h2 class="contact-title" data-i18n="contactTitle">What experience will we create next?</h2>
        <div class="hero-links">
          <a id="email" class="btn primary"></a>
          <span id="contact-links" style="display:contents"></span>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> <span data-name></span></div>
  </footer>

  <script src="js/games.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
